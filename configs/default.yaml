project_root: ..

app:
  storage_root: var/tasks
  database_url: sqlite:///var/blotguard.db
  execution_mode: thread
  max_workers: 2
  max_upload_bytes: 31457280
  max_images_per_file: 100
  max_image_pixels: 50000000
  min_image_side: 64
  allowed_extensions: [jpg, jpeg, jfif, png, tif, tiff, pdf, docx]
  allowed_origins: [http://localhost:4200, http://localhost:8080]
  report_title: 蛋白印迹 AI 生成风险检测报告
  task_retention_days: 30

auth:
  # Local development default. Production deployments must override this with
  # BLOTGUARD_AUTH_SECRET_KEY.
  secret_key: blotguard-local-development-only
  token_ttl_seconds: 28800
  registration_enabled: true

inference:
  mode: real
  device: auto

  detector:
    enabled: true
    code_dir: models/source
    sam_checkpoint: models/weights/sam_vit_b_01ec64.pth
    lora_weight: models/weights/detector/rank8-full12-img_size512-vit_b-blots20-best_f1.pth
    model_type: vit_b
    image_size: 512
    rank: 8
    lora_layers: null
    threshold: 0.5
    preprocess_mode: stretch
    version: detector-sam-vit-b-lora-r8-all-img512-51265aec
    weight_sha256: 51265aecd96858feeead19cc47f9bd3dc0af3fa7d793582482a9287a153c3e25

  localizer:
    enabled: false
    code_dir: models/source
    sam_checkpoint: models/weights/sam_vit_b_01ec64.pth
    lora_weight: models/weights/localizer/rank8-img_size1024-vit_b-best_f1.pth
    model_type: vit_b
    image_size: 1024
    rank: 8
    lora_layers: null
    threshold: 0.5
    preprocess_mode: stretch
    version: localizer-r8-1024-unconfirmed
    weight_sha256: 337ef9d06885a30ec52b8aee69dd0d9c223ef71396f16bcbd57cf5df157fe552
