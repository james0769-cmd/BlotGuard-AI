name: blotguard-dev

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: blotguard
      MYSQL_USER: blotguard
      MYSQL_PASSWORD: blotguard
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      args:
        INSTALL_MODEL_RUNTIME: "false"
    environment:
      BLOTGUARD_DATABASE_URL: mysql+pymysql://blotguard:blotguard@mysql:3306/blotguard
      BLOTGUARD_STORAGE_ROOT: /workspace/var/tasks
      BLOTGUARD_EXECUTION_MODE: thread
      BLOTGUARD_INFERENCE_MODE: mock
      BLOTGUARD_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:4200
    volumes:
      - .:/workspace
      - task_data:/workspace/var/tasks
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "5000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  mysql_data:
  task_data:
